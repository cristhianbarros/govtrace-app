AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GovTrace staging (it. 42b): una máquina con el stack de producción
  (docker-compose.prod.yml) apuntando a la testnet de Stellar, sus buckets y su
  rol. La crea y la actualiza make staging-provision; la despliega make staging-deploy.

Parameters:
  Name:
    Type: String
    Default: govtrace-staging
    AllowedPattern: "[a-z0-9-]+"
    Description: Prefijo de los recursos y de los buckets.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 ARM. provision-staging.sh la busca la primera vez y la deja
      fija: una AMI nueva reemplazaría la máquina y su base de datos.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium]
    Description: 2 GB (más 4 GB de swap para construir la imagen) o 4 GB.
  RepoUrl:
    Type: String
    Default: https://github.com/cristhianbarros/govtrace-app.git
  SecretsPath:
    Type: String
    Default: /govtrace/staging
    AllowedPattern: "/[A-Za-z0-9/_-]+"
    Description: La ruta de los secretos en SSM Parameter Store (SecureString).
  # It. 61 (FinOps): staging duerme de noche. Lo que se ahorra es el cómputo de esas
  # horas; el disco y la IP fija se pagan igual (docs/staging.md, "Lo que cuesta").
  SleepAtNight:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: Apagar la máquina de noche y encenderla en la mañana, en hora de Colombia.
  StopAt:
    Type: String
    Default: cron(0 21 * * ? *)
    Description: Cuándo se apaga (EventBridge Scheduler, America/Bogota). Por defecto, a las 21:00.
  StartAt:
    Type: String
    Default: cron(0 8 * * ? *)
    Description: Cuándo se enciende (EventBridge Scheduler, America/Bogota). Por defecto, a las 8:00.
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      A quién le llegan las alertas del presupuesto y de los gastos fuera de lo
      normal. Vacío, no se crean (provision-staging.sh la toma de STAGING_ALERT_EMAIL).
  MonthlyBudgetUsd:
    Type: Number
    Default: 20
    MinValue: 1
    Description: El presupuesto del mes, en dólares, antes de los créditos.

Conditions:
  Sleeps: !Equals [!Ref SleepAtNight, "yes"]
  Alerts: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # Las evidencias: privadas, cifradas, sin ACL. Nunca se borran con la pila.
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${Name}-evidencias"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # It. 61 (FinOps): una subida que quedó a medias no se paga para siempre.
      LifecycleConfiguration:
        Rules:
          - Id: subidas-a-medias-7-dias
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Los respaldos fuera de la máquina (R-BCK, BACKUP_OFFSITE_S3_URL): los
  # volcados de la base y un espejo de las evidencias. Con versionado, y las
  # versiones anteriores se guardan 30 días: un borrado se puede deshacer
  # (docs/restore.md). En la misma región: el proyecto no admite otra (D14).
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${Name}-respaldos"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: versiones-anteriores-30-dias
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: subidas-a-medias-7-dias
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # It. 61 (seguridad): a los dos buckets solo se llega por HTTPS.
  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # El rol de la máquina: sin llaves en el servidor. Lee solo sus secretos,
  # escribe solo en sus dos buckets, y deja entrar a SSM (sin SSH).
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: govtrace-staging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Objetos
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "${EvidenceBucket.Arn}/*"
                  - !Sub "${BackupBucket.Arn}/*"
              - Sid: Listar
                Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !GetAtt EvidenceBucket.Arn
                  - !GetAtt BackupBucket.Arn
              - Sid: Secretos
                Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretsPath}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretsPath}/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # Solo HTTP (que lleva a HTTPS) y HTTPS. Sin SSH: se entra por SSM.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GovTrace staging - HTTP y HTTPS
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
      Tags:
        - { Key: Name, Value: !Ref Name }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      # It. 61 (seguridad): la base de datos vive en este disco. Nadie la termina por error;
      # para reemplazarla hay que quitar esta protección a propósito (docs/staging.md).
      DisableApiTermination: true
      # IMDSv2, con 2 saltos: los contenedores (detrás del puente de Docker) usan el rol.
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Ref Name }
      # La primera vez que arranca: swap, Docker, el AWS CLI y el código. El
      # despliegue lo hace después make staging-deploy (deploy/staging-up.sh).
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # 4 GB de swap: construir la imagen (Composer y Vite) en 2 GB de RAM.
          if [ ! -f /swapfile ]; then
            fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          apt-get update
          apt-get install -y ca-certificates curl git python3
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          snap install aws-cli --classic
          [ -d /opt/govtrace/.git ] || git clone ${RepoUrl} /opt/govtrace

  # La IP fija: DuckDNS apunta aquí (deploy/staging-up.sh).
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: !Ref Name }

  # It. 61 (FinOps): staging duerme de noche. EventBridge Scheduler apaga y enciende la
  # máquina, sin Lambda; su rol solo puede eso, y solo sobre esta máquina.
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: Sleeps
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: apagar-y-encender
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SoloEstaMaquina
                Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"

  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: Sleeps
    Properties:
      Name: !Sub "${Name}-apagar"
      Description: Apaga staging de noche (it. 61).
      ScheduleExpression: !Ref StopAt
      ScheduleExpressionTimezone: America/Bogota
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

  StartSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: Sleeps
    Properties:
      Name: !Sub "${Name}-encender"
      Description: Enciende staging en la mañana (it. 61).
      ScheduleExpression: !Ref StartAt
      ScheduleExpressionTimezone: America/Bogota
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

  # It. 61 (FinOps): el presupuesto del mes, sin contar los créditos (con ellos, el costo
  # parece cero y la alerta no avisaría nada). Avisa al 50, 80 y 100 % de lo gastado, y
  # cuando el pronóstico pasa del 100 %. Sin acciones: no cuesta.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: Alerts
    Properties:
      Budget:
        BudgetName: !Sub "${Name}-mensual"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # It. 61 (FinOps y seguridad): un gasto fuera de lo normal por servicio (por ejemplo, una
  # máquina que alguien levantó con llaves robadas) llega por correo, una vez al día. Gratis.
  CostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Condition: Alerts
    Properties:
      MonitorName: !Sub "${Name}-servicios"
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE

  CostAnomalyAlert:
    Type: AWS::CE::AnomalySubscription
    Condition: Alerts
    Properties:
      SubscriptionName: !Sub "${Name}-gastos-fuera-de-lo-normal"
      Frequency: DAILY
      MonitorArnList: [!Ref CostAnomalyMonitor]
      Subscribers: [{ Type: EMAIL, Address: !Ref AlertEmail }]
      ThresholdExpression: '{"Dimensions": {"Key": "ANOMALY_TOTAL_IMPACT_ABSOLUTE", "MatchOptions": ["GREATER_THAN_OR_EQUAL"], "Values": ["5"]}}'

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !Ref ElasticIp
  EvidenceBucket:
    Value: !Ref EvidenceBucket
  BackupBucket:
    Value: !Ref BackupBucket
  Schedule:
    Value: !If [Sleeps, !Sub "Se apaga ${StopAt} y se enciende ${StartAt} (America/Bogota)", "Encendida siempre"]
