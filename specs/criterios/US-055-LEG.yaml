story_id: "US-055-LEG"
titulo_historia: "Como Verificador Público quiero saber que el estado de una obra es una alerta de GovTrace y tener a mano los canales oficiales de la Contraloría para no confundir 'En riesgo' con una obra inconclusa y poder denunciar por mi cuenta"
bloque: "Alineación con el proceso actual — A1"
criterios_aceptacion:
  escenarios_exito:
    - "Bajo el estado de cada obra se lee: 'Es una alerta de GovTrace, calculada con los datos de SECOP II y las evidencias publicadas. No es la decisión de una autoridad.'"
    - "En una obra 'En riesgo' se explica que no es lo mismo que una obra inconclusa, con la definición de la Ley 2020 de 2020, y un enlace '¿Qué puede hacer?' lleva a los canales de la Contraloría"
    - "Cada obra tiene la sección '¿Sabe de un problema en esta obra?' con la Línea gratuita 199, el 01 8000 910060, la denuncia en línea (SIPAR) y la página de canales de la Contraloría"
    - "La sección dice que no hace falta ser veedor ni tener cuenta en GovTrace (Ley 1757 de 2015, art. 69; Ley 2020 de 2020, art. 8)"
    - "El '¿Cómo funciona?' del mapa y las estadísticas dicen que los colores son alertas de GovTrace, no decisiones de una autoridad ni obras inconclusas"
  validaciones_reglas:
    - "R-LEG-01: un estado de GovTrace nunca se presenta como decisión de una autoridad ni como 'obra inconclusa'"
    - "R-LEG-02: los canales son los oficiales de la Contraloría; GovTrace no recibe ni reenvía la denuncia"
  manejo_errores: []
  requisitos_ux:
    - "Los teléfonos son enlaces tel: y los enlaces externos se abren en otra pestaña; todos de 44 px o más (R-UX)"
  casos_edge:
    - "La Contraloría General atiende los recursos nacionales: la sección dice que, si la obra se paga con recursos del departamento o del municipio, puede ser competente la contraloría de ese territorio"
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
