story_id: "US-036"
titulo_historia: "Como Administrador de Organización quiero revisar las evidencias ocultas y publicarlas para decidir qué se muestra en nuestro mapa público"
bloque: "B9 — Verificación pública (derivada de publicación manual)"
criterios_aceptacion:
  escenarios_exito:
    - "El Administrador ve una 'Bandeja de Entrada' con una tabla de las evidencias en estado 'Oculto'"
    - "Revisa y publica las evidencias una por una (en el MVP no hay publicación masiva)"
    - "Al publicar ve: \"Evidencia publicada. Ya es visible en el mapa.\" y la evidencia aparece en el mapa y en la línea de tiempo"
    - "Desde la bandeja también puede 'Rechazar' una evidencia escribiendo un motivo: pasa a 'Rechazado', nunca se hace pública (sin lápida) y el veedor ve 'Rechazada' con ese motivo (US-010)"
  validaciones_reglas:
    - "Toda evidencia sellada nace 'Oculta'"
    - "Solo el Administrador de su organización puede publicar o rechazar"
    - "Los reportes marcados por hora sospechosa (R-SEC-05) muestran la marca en la bandeja; no se bloquean ni se rechazan: decide el Administrador"
  manejo_errores: []
  requisitos_ux:
    - "Publicación de una evidencia a la vez, para forzar la revisión responsable"
    - "(It. 40b, 2026-09-29, decidido por el usuario) Cada evidencia de la bandeja dice de qué obra es (nombre y municipio) y qué veedor la envió"
    - "(It. 45f, 2026-10-02, decidido por el usuario) La evidencia que fijó la ubicación oficial de su obra (First-Touch, R-GEO-01) llega marcada: '📍 Este reporte fijó la ubicación oficial de la obra.', con el punto en un mapa pequeño y el enlace 'Corregir ubicación', que abre la corrección de esa obra (US-035). Si la ubicación ya se corrigió, la marca agrega 'Después se corrigió.'"
    - "(It. 45f) Las demás evidencias dicen a qué distancia de la obra se tomaron ('Tomada a 120 m de la obra.'), la que midió el servidor al recibirlas contra la ubicación oficial de ese momento. Nunca se muestran las coordenadas del veedor: solo las del reporte que fijó la ubicación, que son las de la obra"
  casos_edge:
    - "(It. 45f) Rechazar la evidencia que fijó la ubicación no la cambia: la confirmación lo avisa ('Este reporte fijó la ubicación oficial de la obra. Rechazarlo no la cambia: si el lugar está mal, corríjalo en Obras.') y ofrece 'Corregir ubicación'"
    - "(It. 45f) Los reportes recibidos antes de la it. 45f no traen la marca ni la distancia: no se reconstruyen"
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
