story_id: "US-008"
titulo_historia: "Como Veedor de Campo quiero crear un reporte de evidencia vinculado a un contrato público del SECOP (capturando las coordenadas GPS del dispositivo) para registrar una anomalía o avance de obra en terreno"
bloque: "B6 — Captura de evidencia"
criterios_aceptacion:
  escenarios_exito:
    - "El veedor selecciona el contrato en la PWA y toca 'Nuevo Reporte'; el sistema solicita automáticamente el GPS"
    - "El veedor elige la clasificación del reporte, escribe un comentario opcional y adjunta los archivos (US-009)"
    - "Se envía el payload completo: archivos + hashes locales + lat/lng + clasificación + comentario"
    - "Al terminar, la pantalla muestra: \"Reporte recibido con éxito. Su evidencia ha sido encolada para sellado inmutable en la red Stellar.\""
    - "Si la obra no tiene ubicación, la coordenada de este reporte se convierte en la ubicación oficial de la obra (First-Touch, R-GEO-01), guardada en la ficha de obra de GovTrace"
    - "(It. 46f, 2026-10-04, decidido por el usuario) El primer reporte solo fija la ubicación si se tomó a menos de 30 km (parámetro configurable, US-038-CFG) de la cabecera del municipio del contrato (en un contrato departamental, de la cabecera más cercana de su departamento) y con una precisión del GPS de 20 m o menos (fija). Si no, el reporte se recibe igual y la ubicación queda por confirmar: la obra sigue sin ubicación oficial, y el reporte siguiente lo vuelve a intentar con las mismas reglas"
  validaciones_reglas:
    - "Clasificación obligatoria, con uno de estos valores: Avance, Retraso, Abandono"
    - "Comentario opcional, máximo 500 caracteres"
    - "Precisión del GPS (accuracy) igual o inferior a 50 metros; si es mayor, se obliga a reintentar hasta obtener buena señal"
    - "Geocerca: si la obra ya tiene ubicación First-Touch, la coordenada del nuevo reporte debe estar dentro del radio configurado (500 m por defecto, US-038-CFG) (validado en el backend)"
    - "El radio aplicable es el que regía en el momento de la captura, no el vigente al recibir el reporte"
    - "R-VC-04: solo obras del territorio de la organización"
    - "Si la ficha de obra agrupa varios contratos (US-045-INT), el reporte se vincula a la ficha completa"
    - "El servidor registra también su propia hora de recepción y marca el reporte cuando la hora de captura del teléfono está más de 5 minutos en el futuro respecto al servidor (tolerancia por latencia y desfase del reloj) o es anterior a los 7 días de vigencia offline; la marca la ven el Administrador de Organización y el Super Administrador (R-SEC-05)"
  manejo_errores:
    - {caso: "(It. 46f) Primer reporte lejos del municipio del contrato", mensaje: "La ubicación de esta obra queda por confirmar: su reporte se tomó a [X] km de [municipio], y para fijar una obra hay que estar a menos de 30 km de su municipio. La veeduría la revisará."}
    - {caso: "(It. 46f) Primer reporte con una precisión del GPS de más de 20 m", mensaje: "La ubicación de esta obra queda por confirmar: la señal del GPS tenía una precisión de [X] m, y para fijar una obra se necesitan 20 m o menos. La veeduría la revisará."}
    - {caso: "Permiso de GPS denegado", mensaje: "GovTrace requiere acceso a su ubicación exacta para certificar criptográficamente que la evidencia fue tomada en el sitio de la obra. Por favor habilite el GPS."}
    - {caso: "Fuera de la geocerca de 500 m", mensaje: "Se encuentra a [X] km de la ubicación oficial de la obra. Para prevenir fraudes, debe acercarse a un radio de 500 metros del proyecto."}
  requisitos_ux:
    - "Si la precisión del GPS es mayor a 50 m, la app pide reintentar hasta obtener buena señal"
    - "(It. 40b, 2026-09-29) Mientras 'Enviar Reporte' no se puede usar, junto al botón se lee qué falta: la ubicación del GPS, qué vio en la obra, al menos un archivo"
  casos_edge:
    - {caso: "La ubicación oficial fijada por First-Touch es errónea y los veedores en la obra real quedan fuera de la geocerca", resultado: "El Administrador de Organización puede corregir la ubicación de la obra, dejando registro del cambio (nueva historia US-035)"}
    - {caso: "Dos veedores envían al mismo tiempo el primer reporte de una obra sin ubicación", resultado: "Bloqueo atómico en base de datos sobre la ficha de obra: la primera transacción fija la ubicación oficial (First-Touch); la segunda lee esa ubicación y se valida contra la geocerca de 500 m; si ambos están cerca, entran los dos reportes"}
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
