story_id: "US-059-LEG"
titulo_historia: "Como ciudadano quiero informar a la veeduría lo que vi en una obra, con mi correo verificado y sin cuenta, para que lo tenga en cuenta y me responda; como Administrador quiero recibirlo sin ver ese correo, y responder o descartar"
bloque: "Alineación con el proceso actual — A2"
criterios_aceptacion:
  escenarios_exito:
    - "En cada obra, 'Informar a esta veeduría': el ciudadano escribe su correo, autoriza el tratamiento de sus datos y recibe un código de 6 dígitos"
    - "Con el código, su mensaje (20 a 2000 caracteres) y de 1 a 3 fotos opcionales (it. 46h), el informe llega a la veeduría; le llega un correo con la referencia de su informe (it. 46c: 8 caracteres de su identificador público, como 7KQ3-M9XD, y no un número consecutivo)"
    - "El Administrador ve en 'Informes ciudadanos' la obra, la fecha, el mensaje y sus fotos (hasta 3, cada una se abre por separado), sin el correo de quien lo envió"
    - "El Administrador responde desde GovTrace (al ciudadano le llega la respuesta por correo) o lo descarta; los dos quedan en el log de auditoría"
    - "(It. 58, 2026-10-14) En la Lista del mapa, 'Obras sin ubicación todavía': los contratos de obra del territorio que aún no están en el mapa, con la búsqueda por nombre y el filtro de municipio, de a 20. El ciudadano le informa a la veeduría de cualquiera; si la obra no tenía ficha, se crea sin ubicación"
    - "(It. 58) En una obra sin ubicación, '¿Dónde queda la obra?' (opcional): el ciudadano marca un punto en un mapa que empieza en la cabecera del municipio del contrato. La propuesta llega con el informe y no pone la obra en el mapa: la confirma el Administrador (US-035)"
  validaciones_reglas:
    - "(It. 52, 2026-10-10) Los informes de ciudadanos llegan de a 20 (los más recientes primero) con 'Ver 20 más' y el total, y se filtran por estado (Por responder, Atendidos, Descartados)"
    - "R-LEG-09: un informe ciudadano no se sella ni se publica; no cambia el estado de la obra"
    - "R-LEG-10: el correo se guarda cifrado y la veeduría nunca lo ve"
    - "R-LEG-07: sin autorizar el tratamiento de datos no se pide el código"
    - "Una veeduría suspendida no recibe informes"
    - "Solo el Administrador ve los informes"
    - "(It. 58) Solo se informa de los contratos del territorio de la veeduría que se pueden reportar: los mismos del veedor (R-SEC-07)"
    - "(It. 58) La ubicación propuesta es el lugar de la obra, no el de la persona: no sale de la foto ni del GPS del teléfono (R-PRIV-01)"
    - "(It. 58) Una obra que ya tiene ubicación no la pide; si el informe la trae igual, se recibe sin ella"
    - "(It. 68, 2026-10-18, pedido por el usuario) En una obra sin ubicación, el ciudadano escribe la dirección o un sitio conocido y toca 'Buscar': GovTrace busca en OpenStreetMap (Nominatim) desde el servidor, con solo ese texto, dentro de la zona del municipio de la obra (la misma distancia de su cabecera que admite una ubicación propuesta) y hasta 5 lugares. Se busca al tocar 'Buscar', nunca letra a letra (la política de Nominatim no admite autocompletar), una búsqueda por segundo y por veeduría, y cada una se guarda 30 días. Lo que escribió (hasta 200 caracteres) llega con su informe, aunque no elija un lugar; no se publica"
  manejo_errores:
    - "Código equivocado o vencido: 'El código no es válido o ya venció. Pida uno nuevo.'; 5 intentos fallidos lo anulan"
    - "Más de 3 informes del mismo correo en un día, o 2 de la misma obra: 429 con el motivo"
    - "Una foto con metadatos, de otro formato o de más de 10 MB se rechaza con el motivo"
    - "(It. 46h) Un informe admite hasta 3 fotos: la 4.ª se rechaza con 'Un informe admite máximo 3 fotos.'; si una foto se rechaza, el informe no guarda ninguna"
    - "(It. 46h) El borrado de un informe descartado, a los 30 días, borra todas sus fotos"
    - "(It. 46e, R-PRIV-05) La foto opcional pasa por la misma revisión que la del veedor: los rostros se difuminan en el celular antes de enviarla"
    - "(It. 58) Una ubicación propuesta a más de 30 km de la cabecera del municipio del contrato (el parámetro de R-GEO-01): 'Ese punto queda a más de 30 km de Santa Marta. Revise dónde marcó la obra, o envíe el informe sin la ubicación.' El informe no se recibe, y el código sigue sirviendo"
    - "(It. 58) Un contrato fuera del territorio, o que ya no se puede reportar: 'Esa obra no está entre las que vigila esta veeduría.'"
  requisitos_ux:
    - "(It. 46h) El ciudadano tiene las mismas opciones del veedor: 'Tomar foto' abre la cámara trasera, y 'Elegir de la galería'; solo fotos, sin PDF, y cada foto se revisa antes de adjuntarla, de a una"
    - "Dos pasos en la misma obra: el correo, y después el código y el mensaje; botones de 44 px y letra de 16 px"
    - "(It. 68) Junto al buscador, el crédito 'Búsqueda con datos de © OpenStreetMap' (licencia ODbL). Elegir un lugar pone el punto allí, y se puede mover"
  casos_edge:
    - "Pedir un código nuevo anula el anterior"
    - "(It. 64, 2026-10-17, pedido por el usuario: el código y el informe se sentían lentos) El código, el acuse y la respuesta salen por la cola de correos, después de guardar: la pantalla no espera al servidor de correo (con Gmail, 1 a 3 s por correo). Si el servidor falla, el correo se reintenta hasta 5 veces (a los 10 s, 30 s, 1 min y 2 min), sin error para el ciudadano. En la cola van cifrados: ni el código ni el correo quedan legibles. Igual todos los correos de GovTrace"
    - "(It. 58) Un ciudadano y un veedor informan a la vez del mismo contrato sin ficha: la obra queda con una sola ficha, con el informe y el reporte"
