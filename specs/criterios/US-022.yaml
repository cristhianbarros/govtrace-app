story_id: "US-022"
titulo_historia: "Como Super Administrador quiero ver el saldo en XLM de la cuenta patrocinadora y recibir alertas cuando caiga bajo un umbral para recargarla antes de que se detenga el sellado"
bloque: "B11 — Monitoreo y costos"
# Ajustada a Stellar en la it. 32 (pivote del 2026-09-28, D5, D11, D12).
criterios_aceptacion:
  escenarios_exito:
    - "Una tarea programada consulta el saldo de la cuenta patrocinadora cada 15 minutos a través del RPC de Stellar"
    - "Si el saldo es menor al umbral (sponsor_balance_alert_threshold_xlm, 50 XLM por D12), se envía de inmediato una alerta por Email y por Webhook (Slack/Discord) al rol Super Administrador"
    - "Una tarea diaria revisa la vigencia (TTL) de la instancia y del código del contrato de sellado y avisa cuando a alguna le quedan menos de 30 días (D12: la extensión la paga la tesorería)"
    - "El Super Administrador ve en su panel el saldo actual, el umbral y la vigencia del contrato"
  validaciones_reglas:
    - "Umbral crítico: saldo < umbral configurado (50 XLM)"
    - "Frecuencia de consulta del saldo: cada 15 minutos"
    - "Una alerta por cruce: no se repite cada 15 minutos mientras el saldo siga bajo; se vuelve a armar cuando el saldo supera el umbral"
    - "Aviso de vigencia: menos de 30 días, uno por cada fecha de vencimiento (tras una extensión, se vuelve a armar)"
  manejo_errores:
    - {caso: "Saldo bajo el umbral", mensaje: "🚨 URGENTE: La cuenta patrocinadora de GovTrace tiene saldo crítico ([Saldo] XLM). Recargue la cuenta [Dirección] inmediatamente para evitar el bloqueo en la cola de sellado."}
    - {caso: "Vigencia del contrato por vencer", mensaje: "⏳ La vigencia [del código | de la instancia] del contrato de sellado vence en [N] días ([fecha]). Extiéndala desde la cuenta de tesorería antes de esa fecha: si vence, el siguiente sello la restaura con cargo a la cuenta patrocinadora."}
  requisitos_ux: []
  casos_edge:
    - "El Webhook no está configurado (ALERT_WEBHOOK_URL vacío): la alerta sale solo por Email"
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
