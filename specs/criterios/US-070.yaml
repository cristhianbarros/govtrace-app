story_id: "US-070"
titulo_historia: "Como Administrador de una veeduría quiero pedir la sincronización con el SECOP II de mi territorio sin esperar a la noche, para reportar un contrato que se publicó hoy"
bloque: "Iteración 63 — Sincronizar el SECOP desde la veeduría"
criterios_aceptacion:
  escenarios_exito:
    - "En 'Contratos', 'Sincronizar ahora': despacha la sincronización de su territorio solamente (SyncSecopContracts con el id de la veeduría) y dice 'Buscamos los contratos de su territorio en el SECOP II. En unos minutos verá el resultado aquí.'"
    - "La pantalla dice cómo le fue a la última sincronización que cubrió su territorio (la de la noche o la suya): cuándo terminó y cuántos contratos nuevos y actualizados le trajo; si está en curso, 'Sincronizando…', y la pantalla se actualiza sola mientras tanto"
    - "Si la última falló: 'La última sincronización falló. GovTrace la vuelve a intentar sola.'"
  validaciones_reglas:
    - "Una sincronización cada 5 minutos por veeduría; otra veeduría puede pedir la suya"
    - "Solo el Administrador de la veeduría la pide y ve su resultado"
  manejo_errores:
    - "Otra antes de 5 minutos: 'Ya pidió una sincronización hace menos de 5 minutos. Espere su resultado.' (429)"
  requisitos_ux:
    - "Junto al botón: 'GovTrace lee los contratos de los datos abiertos del SECOP II en datos.gov.co. Uno que el SECOP aún no publica allí llega cuando lo publique.'"
    - "Botón de 44 px y letra de 16 px"
  casos_edge:
    - {caso: "Una sincronización de otra veeduría", resultado: "No se muestra: solo la de la noche (todas) o la suya"}
    - {caso: "Nunca se ha sincronizado", resultado: "'Aún no se ha sincronizado.'"}
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
