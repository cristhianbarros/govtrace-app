story_id: "US-067"
titulo_historia: "Como persona que pasa del Inicio de GovTrace al sitio de una veeduría, o al revés, quiero ver en cada pantalla dónde estoy y poder volver a cada nivel con un toque, para no quedarme atrapado en una veeduría sin saber cómo regresar a GovTrace o a mi panel"
bloque: "Iteración 62 — Saber dónde estoy y volver a GovTrace"
criterios_aceptacion:
  escenarios_exito:
    - "En el sitio de una veeduría, arriba, la ruta 'GovTrace › <veeduría>'; 'GovTrace' lleva al Inicio de GovTrace, en su propio dominio"
    - "En una pantalla interna del sitio, la ruta suma la pantalla: 'GovTrace › <veeduría> › <pantalla>' (una obra, un contrato, Estadísticas, Validar, la política de datos, iniciar sesión)"
    - "En el panel de la veeduría: 'GovTrace › <veeduría> › Panel › <pantalla>'; la veeduría lleva a su sitio público y 'Panel' a la Bandeja"
    - "En el panel global: 'GovTrace › Panel global › <pantalla>'; 'Panel global' lleva a Organizaciones"
    - "En la app del veedor, Mis Reportes: 'GovTrace › <veeduría> › Mis Reportes'"
    - "En Organizaciones, cada veeduría que no está dada de baja tiene 'Ver su sitio', que abre su sitio en su subdominio"
    - "En el Inicio de GovTrace, con la sesión del Super Administrador abierta, el menú de la cuenta ofrece 'Ir al panel global'"
    - "En el acceso de una veeduría: '¿Es Super Administrador de GovTrace? Su acceso está en el Inicio de GovTrace.', con el enlace al acceso de GovTrace"
  validaciones_reglas:
    - "La pantalla actual va al final de la ruta, sin enlace, marcada para el lector de pantalla (aria-current)"
    - "Un nivel que apunta a la pantalla en la que ya está la persona no es enlace"
    - "La ruta es una navegación con nombre ('Ruta'), una lista ordenada"
    - "Las sesiones siguen siendo de cada dirección: la ruta solo lleva, no comparte la sesión"
  manejo_errores:
    - "Una veeduría dada de baja no tiene 'Ver su sitio': su sitio está fuera de línea"
  requisitos_ux:
    - "En el celular, la ruta se resume en un solo enlace, '← <nivel anterior>', al nivel más cercano que no es la pantalla actual"
    - "Reemplaza los '← Volver al mapa' de arriba de la obra, del contrato y del acceso, para no tener dos enlaces que hacen lo mismo"
    - "Letra de 16 px y enlaces de 44 px de alto o más"
  casos_edge:
    - {caso: "El Inicio de GovTrace", resultado: "Sin ruta: es la raíz"}
    - {caso: "El veedor llena un reporte (Nuevo reporte)", resultado: "Sin ruta: un toque por error no lo saca a mitad de camino"}
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
