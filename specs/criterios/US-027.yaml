story_id: "US-027"
titulo_historia: "Como Verificador Público quiero ver un mapa interactivo con pines de obras que cambian de color automáticamente según su estado para detectar de un vistazo los proyectos en riesgo o abandono"
bloque: "B8 — Mapa y publicación"
criterios_aceptacion:
  escenarios_exito:
    - "🟢 Verde (Normal): obra en ejecución, sin alertas y dentro del plazo"
    - "🟡 Amarillo (Alerta/Retraso): obra en plazo cuya evidencia PUBLICADA más reciente fue clasificada como 'Retraso'"
    - "🔴 Rojo (En riesgo/Vencida): la fecha de terminación expiró y SECOP la sigue mostrando 'En ejecución' (US-034), o la evidencia PUBLICADA más reciente es de 'Abandono'"
  validaciones_reglas:
    - "(It. 56, 2026-10-10; propuesta de Claude, aprobada por el usuario) Lo público (los pines, la lista, los filtros, las estadísticas y la vista de cada obra) se guarda 60 segundos por organización (PUBLIC_CACHE_SECONDS; 0 apaga la caché), con una entrada por cada combinación de filtros; la caché lleva el prefijo de la organización y nunca le sirve a otra. Una decisión editorial (publicar, rechazar, retirar), una ubicación corregida, una ficha agrupada o el cambio de riesgo del cálculo diario la borran al instante. Los endpoints públicos de lectura no abren una sesión ni ponen cookies"
    - "(It. 53, 2026-10-10; pedido por el usuario) El punto público es aproximado (R-PRIV-02) y el mapa lo dice: un círculo de unos 100 m alrededor de cada pin (no recibe el toque) y la nota 'Cada punto es aproximado: la obra está a unos 100 m de él. Es para proteger a quien tomó la foto.' Lo que confundió fue que el pin parecía exacto; la regla de privacidad no cambia"
    - "R-MAP-01: cada organización tiene su mapa público aislado en su subdominio"
    - "R-MAP-02: la carga inicial solo trae [{id, lat, lng, color_pin}]"
    - "(It. 60) La tarjeta de una obra se pide al tocar su pin, con lo que la tarjeta muestra y nada más: no trae la línea de tiempo ni las fotos completas"
    - "Solo tienen pin las obras con ubicación (First-Touch)"
    - "Las obras Terminadas/Liquidadas dentro de la ventana de 12 meses siguen las mismas reglas de color (según su evidencia publicada más reciente) y son verdes si no tienen ninguna"
    - "Si una ficha agrupa varios contratos (US-045-INT), el pin toma el peor estado entre sus contratos"
    - "El color refleja la última verdad conocida: lo dicta la evidencia publicada más reciente (ej. si tras un 'Abandono' se publica un 'Avance', el pin deja de ser rojo por abandono)"
  manejo_errores: []
  requisitos_ux:
    - "It. 40e: el sitio de la veeduría se recorre con pestañas — Obras, Estadísticas y Validar —, con la actual marcada (aria-current), de 44 px o más"
    - "(It. 40b, 2026-09-29) Los estados se explican junto al mapa, arriba y sin desplazarse, con un signo además del color (✓ Normal, ! Alerta, ✕ En riesgo) y cuántas obras hay de cada uno; tocar un estado filtra el mapa"
    - "(It. 40d, 2026-09-30, decisión por defecto) El Inicio de GovTrace lista cada veeduría activa o suspendida con su territorio y el enlace a su mapa; no es un mapa global (R-MAP-01); las dadas de baja no aparecen"
  casos_edge: []
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
