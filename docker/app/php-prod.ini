; ---------------------------------------------------------------------------
; Values for the qa/production stage (immutable image).
; ---------------------------------------------------------------------------

memory_limit        = 256M
max_execution_time  = 60
upload_max_filesize = 64M
post_max_size       = 64M
max_file_uploads    = 20

; Never show errors to the client outside development.
display_errors         = Off
display_startup_errors = Off
error_reporting        = E_ALL & ~E_DEPRECATED
log_errors             = On
error_log              = /dev/stderr

; No revalidation: code is immutable inside the image.
opcache.enable                = 1
opcache.enable_cli            = 0
opcache.validate_timestamps   = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption    = 192

expose_php    = Off
date.timezone = ${TZ}
