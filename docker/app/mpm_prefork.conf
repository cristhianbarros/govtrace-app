# It. 50 — cuántos procesos atienden a la vez. Cada uno abre hasta dos conexiones
# a PostgreSQL (la base central y la de la organización), y PostgreSQL permite 100:
# con los 150 que Apache trae, la prueba de carga las agotó (3.840 errores 500).
# 30 procesos son 60 conexiones, y quedan 40 para el worker, el calendario, los
# respaldos y quien entre a la base. También caben en 2 GB (unos 30 a 60 MB cada
# uno). Lo que sobra espera en la cola de Apache (ListenBacklog) en vez de fallar.
# Una máquina más grande sube MaxRequestWorkers junto con max_connections de PostgreSQL.
StartServers            5
MinSpareServers         5
MaxSpareServers         10
MaxRequestWorkers       30
# Recicla cada proceso tras 500 peticiones: PHP no devuelve toda su memoria.
MaxConnectionsPerChild  500
