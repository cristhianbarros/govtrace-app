; ---------------------------------------------------------------------------
; DEVELOPMENT values. Never in production (see php-prod.ini).
; The zz- prefix makes it load last and win over the defaults.
; Upload limits are placeholders until the spec defines evidence sizes;
; keep them in sync with client_max_body_size in docker/proxy/nginx.conf.
; ---------------------------------------------------------------------------

memory_limit        = 256M
max_execution_time  = 60
upload_max_filesize = 64M
post_max_size       = 64M
max_file_uploads    = 20

; In development a failure must be visible.
display_errors         = On
display_startup_errors = On
error_reporting        = E_ALL
log_errors             = On
error_log              = /dev/stderr

; OPcache on but revalidating every request: realistic performance without
; restarting anything after editing a file.
opcache.enable              = 1
opcache.enable_cli          = 0
opcache.revalidate_freq     = 0
opcache.validate_timestamps = 1

expose_php    = Off
date.timezone = ${TZ}
