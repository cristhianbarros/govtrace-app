<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Debian ships AllowOverride None: without this Apache ignores
        # public/.htaccess, the front controller never rewrites and every
        # route except "/" returns 404.
        AllowOverride All
        Options -Indexes -MultiViews +FollowSymLinks
        Require all granted
    </Directory>

    # Defence in depth: DocumentRoot is public/, this covers a symlink
    # created by mistake.
    <DirectoryMatch "^/var/www/html/(\.git|storage|bootstrap|vendor|node_modules|tests|docker|specs|sessions|features)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.(env|env\..*|gitignore|gitattributes)$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Real client IP behind the reverse proxy. Only the compose subnet is
    # trusted (never 0.0.0.0/0) so nobody can spoof X-Forwarded-For.
    # InternalProxy and NOT TrustedProxy: TrustedProxy refuses any private
    # client IP (10/8, 172.16/12, 192.168/16...) reported by the proxy, so on
    # a Docker network it would never rewrite anything.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${DOCKER_SUBNET}

    # It. 42a: la visita que llegó por HTTPS al proxy lo es también para PHP.
    # Laravel no la puede reconocer por su cuenta: mod_remoteip ya cambió la IP
    # del proxy por la del visitante, que no es de confianza. Se cree sin mirar
    # quién la manda porque solo el proxy llega a este contenedor (expose, sin
    # ports), y nginx siempre sobrescribe X-Forwarded-Proto.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # %a and not %h: mod_remoteip only rewrites %a. The stock "combined"
    # format logs %h, which is always the proxy.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" govtrace
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout govtrace
</VirtualHost>
