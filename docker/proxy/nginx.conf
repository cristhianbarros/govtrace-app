# Without this resolver nginx caches the container IP at startup and fails if
# Docker assigns a new one, or if the upstream does not exist yet (profiles off).
resolver 127.0.0.11 ipv6=off valid=10s;

# http context: applies to EVERY server below. Keep in sync with
# post_max_size in docker/app/php-*.ini.
client_max_body_size 64M;
server_tokens off;

server {
    listen 80 default_server;
    # Central domain + one subdomain per tenant (stancl/tenancy, by domain).
    # *.localhost resolves to loopback without touching /etc/hosts.
    server_name govtrace.localhost *.govtrace.localhost localhost;

    location / {
        set $upstream_app app:80;
        proxy_pass http://$upstream_app;

        # $http_host and NOT $host: $host drops the port, so Laravel would
        # build redirects without ":8080". It is also the Host that
        # InitializeTenancyByDomain uses to resolve the tenant.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr and NOT $proxy_add_x_forwarded_for: this proxy is the
        # edge, so any X-Forwarded-For sent by the client is a spoof and is
        # discarded. Revisit only if a load balancer is placed in front.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PHP's max_execution_time must be the one that sets the limit.
        proxy_read_timeout      120s;
        proxy_send_timeout      120s;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name adminer.govtrace.localhost;
    location / {
        set $upstream_adminer adminer:8080;
        proxy_pass http://$upstream_adminer;
        proxy_set_header Host $http_host;
        # Large imports take a while: default would 504 at 60s.
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
        proxy_request_buffering off;
    }
}
